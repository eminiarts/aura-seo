<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="assets/styles.css"></head>
<body data-screen="permissions">
<main id="prototype-content">
    <header class="page-header"><div><p class="eyebrow">Settings / Roles</p><h1>Edit SEO Manager role</h1><p class="lede">Choose which SEO features members of this role can use.</p></div><div class="button-row"><button class="button" type="button">Cancel</button><button class="button primary" type="button">Save role</button></div></header>

    <div class="grid layout-main">
        <section class="card"><div class="card-body">
            <div class="form-section" style="margin-top:0;padding-top:0;border-top:0">
                <div class="form-section-title"><div><p class="section-label">Role details</p><h2>SEO Manager</h2></div></div>
                <div class="form-grid">
                    <div class="field full"><label for="role-name">Name</label><input class="input" id="role-name" value="SEO Manager"></div>
                    <div class="field full"><label for="role-description">Description</label><textarea class="textarea" id="role-description">Manages SEO settings and reviews SEO checks.</textarea></div>
                </div>
            </div>

            <div class="form-section">
                <div class="form-section-title"><div><p class="section-label">Permissions</p><h2>SEO</h2><p class="tiny">Choose what members of this role can do in Aura SEO.</p></div><div class="button-row"><button class="button small" type="button">Select all</button><button class="button small" type="button">Clear</button></div></div>
                <label class="selection"><input type="checkbox" checked><span><strong>Manage Aura SEO</strong><span>Change SEO settings and record metadata.</span></span></label>
                <label class="selection"><input type="checkbox" checked><span><strong>View Aura SEO checks</strong><span>Review SEO issues and open affected content.</span></span></label>
            </div>
        </div></section>

        <aside class="stack">
            <section class="card"><div class="card-header"><div><p class="section-label">Members</p><h2>5 users</h2></div></div><div class="card-body"><p class="muted">Users assigned to this role receive the selected SEO permissions.</p><button class="button small" type="button" style="margin-top:12px">View members</button></div></section>
        </aside>
    </div>
</main>
<script src="assets/prototype.js"></script>
</body>
</html>
